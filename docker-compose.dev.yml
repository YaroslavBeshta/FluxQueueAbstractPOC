services:
  ##### POSTGRES #################################
  db:
    image: postgres:14
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env.dev
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1 -p 5432" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  telegram_bot:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.telegram_bot
    env_file:
      - .env.dev
    entrypoint: [ "/docker-entrypoint.sh", "apps/telegram_bot/main.py" ]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source code for development hot-reload (if using a tool like watchdog)
      - ./apps:/app/apps
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=dev

  notifier:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.notifier
    env_file:
      - .env.dev
    entrypoint: [ "/docker-entrypoint.sh", "apps/notifications/main.py" ]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source code for development hot-reload
      - ./apps:/app/apps
      - ./packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=dev

volumes:
  postgres_data:

